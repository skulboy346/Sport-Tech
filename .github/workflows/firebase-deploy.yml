# .github/workflows/firebase-deploy.yml
name: Deploy SportTech to Firebase Hosting

# Trigger the deployment only when you push to the 'main' or 'master' branch
on:
  push:
    branches:
      - main
      - master

# A 'job' to execute Node commands in the cloud
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone the SportTech code from your GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up professional Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install the full Firebase Tools CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Step 4: Deploy only Hosting to your specific project, using the secret token
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPORTTECH_WEB }}
