<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SportTech | The Athletics Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { feedDark: '#0a0a0a', feedCard: '#171717', accent: '#10b981', botBlue: '#3b82f6' } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .pb-safe { padding-bottom: max(5rem, env(safe-area-inset-bottom)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-feedDark text-white font-sans antialiased pb-safe relative">

  <!-- TOP NAVIGATION BAR -->
  <nav class="fixed top-0 w-full z-40 bg-feedDark/90 backdrop-blur-md border-b border-white/10 px-4 py-3 flex flex-col gap-3">
    <div class="flex justify-between items-center">
      <button class="text-neutral-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-emerald-700 flex items-center justify-center font-bold text-sm">ST</div>
        <span class="font-extrabold tracking-tight text-lg">SportTech</span>
      </div>
      <div class="w-6"></div> <!-- Spacer for centering -->
    </div>
    
    <!-- Feed Toggle -->
    <div class="flex gap-2 max-w-lg mx-auto w-full px-2">
      <button onclick="toggleFeed('social')" id="btnTabSocial" class="flex-1 py-1.5 text-sm font-bold bg-white/10 text-white rounded-lg transition">Social Feed</button>
      <button onclick="toggleFeed('events')" id="btnTabEvents" class="flex-1 py-1.5 text-sm font-bold text-neutral-500 hover:text-white transition rounded-lg">Upcoming Events</button>
    </div>
  </nav>

  <!-- MAIN DYNAMIC FEEDS -->
  <main class="max-w-lg mx-auto mt-28 px-4 space-y-6" id="mainContainer">
    
    <!-- SOCIAL POSTS CONTAINER -->
    <div id="socialFeedContainer" class="space-y-6">
      <div class="text-center py-10 text-neutral-500 italic animate-pulse">Loading network pulse...</div>
    </div>

    <!-- EVENTS CONTAINER -->
    <div id="eventsFeedContainer" class="space-y-6 hidden">
      <div class="text-center py-10 text-neutral-500 italic animate-pulse">Scanning global events matrix...</div>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR (Kept Identical) -->
  <nav class="fixed bottom-0 w-full z-40 bg-feedDark/95 backdrop-blur-lg border-t border-white/10 px-6 py-4 flex justify-between items-center pb-safe">
    <button onclick="window.scrollTo(0,0)" class="text-white flex flex-col items-center"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg></button>
    <button class="text-neutral-500 hover:text-white transition-colors flex flex-col items-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></button>
    <button class="text-neutral-500 hover:text-white transition-colors flex flex-col items-center"><div class="bg-accent text-feedDark rounded-lg p-1"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></div></button>
    <button class="text-neutral-500 hover:text-white transition-colors flex flex-col items-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg></button>
    <button onclick="checkProfileAccess()" class="text-neutral-500 hover:text-white transition-colors flex flex-col items-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></button>
  </nav>

  <!-- COMMENTS MODAL -->
  <div id="commentsModal" class="fixed inset-0 z-50 hidden flex justify-center items-end md:items-center">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleCommentsModal()"></div>
    <div class="relative bg-feedCard w-full md:w-[500px] h-[80vh] md:h-[600px] flex flex-col rounded-t-3xl md:rounded-2xl shadow-2xl border border-white/10 slide-up md:mb-0 mb-safe">
      <div class="p-4 border-b border-white/5 flex justify-between items-center bg-feedDark/50 rounded-t-3xl md:rounded-t-2xl">
        <h3 class="font-bold text-lg text-center flex-1">Comments</h3>
        <button onclick="toggleCommentsModal()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center hover:bg-white/10 transition absolute right-4 text-neutral-400">✕</button>
      </div>
      <div id="commentsList" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar"></div>
      <div class="p-4 bg-feedDark border-t border-white/5">
        <form id="commentForm" class="flex gap-2 relative">
          <input type="text" id="commentInput" class="flex-1 bg-feedCard border border-white/10 rounded-full pl-4 pr-12 py-3 text-sm text-white focus:outline-none focus:border-accent" placeholder="Add a public comment..." autocomplete="off">
          <button type="submit" id="btnSubmitComment" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-accent rounded-full flex items-center justify-center text-feedDark hover:bg-emerald-500 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- AUTHENTICATION MODAL (Hidden for brevity, but connects exactly as before) -->
  <div id="authModal" class="fixed inset-0 z-50 hidden flex justify-center items-end md:items-center">
     <!-- Include your existing Auth Modal HTML here from previous steps -->
  </div>
  <script src="./scripts/js/auth.js" type="module"></script>

  <!-- ========================================== -->
  <!-- DYNAMIC SOCIAL & EVENT ENGINE -->
  <!-- ========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, updateDoc, arrayUnion, arrayRemove, addDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyC1zozSx_Ox4uf3IN8zBN0dKE--rpIohgU", authDomain: "sportteach-web.firebaseapp.com", projectId: "sportteach-web", storageBucket: "sportteach-web.firebasestorage.app", messagingSenderId: "155474289568", appId: "1:155474289568:web:7248149d14dd63e35a3ac5" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let activeUserId = null;
    let activeUserEmail = null;
    let activeUsername = null;
    let currentActivePostId = null; 
    let commentsUnsubscribe = null;

    // PAYSTACK KEY FOR TICKET PURCHASES
    const PAYSTACK_PUBLIC_KEY = "pk_test_REPLACE_THIS_WITH_YOUR_PAYSTACK_KEY";

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        activeUserId = user.uid;
        activeUserEmail = user.email;
        const userSnap = await getDoc(doc(db, "users", user.uid));
        if (userSnap.exists()) activeUsername = userSnap.data().username;
      } else {
        activeUserId = null; activeUserEmail = null; activeUsername = null;
      }
    });

    window.checkProfileAccess = function() {
      if (!activeUserId) alert("Please log in first."); // Or trigger auth modal
      else window.location.href = 'profile.html';
    };

    // UI: Toggle between Feeds
    window.toggleFeed = function(feedType) {
      const socialContainer = document.getElementById('socialFeedContainer');
      const eventsContainer = document.getElementById('eventsFeedContainer');
      const btnSocial = document.getElementById('btnTabSocial');
      const btnEvents = document.getElementById('btnTabEvents');

      if(feedType === 'social') {
        socialContainer.classList.remove('hidden');
        eventsContainer.classList.add('hidden');
        btnSocial.className = 'flex-1 py-1.5 text-sm font-bold bg-white/10 text-white rounded-lg transition';
        btnEvents.className = 'flex-1 py-1.5 text-sm font-bold text-neutral-500 hover:text-white transition rounded-lg';
      } else {
        eventsContainer.classList.remove('hidden');
        socialContainer.classList.add('hidden');
        btnEvents.className = 'flex-1 py-1.5 text-sm font-bold bg-white/10 text-white rounded-lg transition';
        btnSocial.className = 'flex-1 py-1.5 text-sm font-bold text-neutral-500 hover:text-white transition rounded-lg';
      }
    }

    // ==========================================
    // 1. RENDER SOCIAL FEED
    // ==========================================
    const socialFeedContainer = document.getElementById('socialFeedContainer');
    const postsQuery = query(collection(db, "posts"), orderBy("timestamp", "desc"), limit(20));
    
    onSnapshot(postsQuery, (snapshot) => {
      socialFeedContainer.innerHTML = ''; 
      if (snapshot.empty) return socialFeedContainer.innerHTML = '<div class="text-center py-10 text-neutral-500">No posts yet.</div>'; 

      snapshot.forEach((postDoc) => {
        const post = postDoc.data();
        const postId = postDoc.id;
        const initial = post.authorName ? post.authorName.charAt(0).toUpperCase() : 'O';
        const isLiked = activeUserId ? (post.likedBy || []).includes(activeUserId) : false;
        const heartColor = isLiked ? 'text-accent fill-accent' : 'text-white hover:text-accent';

        let mediaHTML = '';
        if (post.mediaUrl) {
          mediaHTML = post.mediaType === 'video' 
            ? `<div class="w-full bg-black relative"><video src="${post.mediaUrl}" controls class="w-full max-h-[500px] object-contain"></video></div>` 
            : `<div class="w-full h-72 bg-neutral-800 relative bg-cover bg-center" style="background-image: url('${post.mediaUrl}')"></div>`;
        }

        socialFeedContainer.innerHTML += `
          <article class="bg-feedCard border border-white/5 rounded-2xl overflow-hidden shadow-lg slide-up pb-2">
            <div class="p-4 flex justify-between items-center">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex justify-center items-center font-bold text-sm">${initial}</div>
                <div><div class="flex items-center gap-1"><span class="font-bold text-sm">${post.authorName || 'Organizer'}</span><svg class="w-4 h-4 text-blue-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6 12.6l1.5-1.5 2.6 2.6 6.4-6.4 1.5 1.5-7.9 7.9z"/></svg></div>
                <span class="text-xs text-neutral-400">@${post.username || 'user'}</span></div>
              </div>
            </div>
            ${mediaHTML}
            <div class="px-4 py-3 flex gap-4 border-t border-white/5">
              <button onclick="toggleLike('${postId}')" class="flex items-center gap-1.5 group"><svg class="w-6 h-6 transition-colors ${heartColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg><span class="text-sm font-semibold">${(post.likedBy || []).length}</span></button>
              <button onclick="openComments('${postId}')" class="flex items-center gap-1.5 text-white hover:text-botBlue"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg><span class="text-sm font-semibold">${post.commentsCount || 0}</span></button>
            </div>
            <div class="px-4 pb-2"><p class="text-sm whitespace-pre-wrap"><span class="font-bold mr-1">${post.username || 'user'}</span>${post.caption}</p></div>
          </article>`;
      });
    });

    // ==========================================
    // 2. RENDER EVENTS FEED & TICKETING
    // ==========================================
    const eventsFeedContainer = document.getElementById('eventsFeedContainer');
    const eventsQuery = query(collection(db, "events"), orderBy("timestamp", "desc"), limit(20));
    
    onSnapshot(eventsQuery, (snapshot) => {
      eventsFeedContainer.innerHTML = ''; 
      if (snapshot.empty) return eventsFeedContainer.innerHTML = '<div class="text-center py-10 text-neutral-500">No upcoming events right now.</div>';

      snapshot.forEach((eventDoc) => {
        const ev = eventDoc.data();
        const eventId = eventDoc.id;
        
        let priceTag = ev.ticketType === 'free' 
          ? `<span class="bg-accent/20 text-accent font-bold px-3 py-1 rounded text-xs uppercase tracking-wider">Free Entry</span>` 
          : `<span class="bg-botBlue/20 text-botBlue font-bold px-3 py-1 rounded text-xs uppercase tracking-wider">₦${ev.ticketPrice.toLocaleString()}</span>`;

        let actionBtnText = ev.ticketType === 'free' ? "Get Free Ticket" : "Buy Ticket";

        eventsFeedContainer.innerHTML += `
          <article class="bg-feedCard border border-white/5 rounded-2xl overflow-hidden shadow-lg slide-up mb-6">
            <div class="w-full h-48 bg-neutral-800 relative bg-cover bg-center" style="background-image: url('${ev.bannerUrl}')">
              <div class="absolute inset-0 bg-gradient-to-t from-feedCard to-transparent"></div>
              <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
                <div>
                  <p class="text-xs font-bold text-accent mb-1">${ev.date} @ ${ev.time}</p>
                  <h3 class="text-xl font-black leading-tight">${ev.title}</h3>
                </div>
                ${priceTag}
              </div>
            </div>
            <div class="p-4 space-y-4">
              <div class="flex items-center gap-2 text-sm text-neutral-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                ${ev.location}
              </div>
              <p class="text-sm text-neutral-300 line-clamp-2">${ev.description}</p>
              
              <div class="pt-2 border-t border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="text-xs text-neutral-500">Hosted by @${ev.username}</span>
                </div>
                <button onclick="processTicket('${eventId}', '${ev.title}', '${ev.ticketType}', ${ev.ticketPrice})" class="bg-white/10 hover:bg-white/20 font-bold px-4 py-2 rounded-lg text-sm transition">
                  ${actionBtnText}
                </button>
              </div>
            </div>
          </article>
        `;
      });
    });

    // TICKETING LOGIC
    window.processTicket = function(eventId, title, type, price) {
      if (!activeUserId) return alert("Please log in to claim a ticket."); // Or trigger modal

      if (type === 'free') {
        issueDigitalTicket(eventId, title, "FREE");
      } else {
        if(PAYSTACK_PUBLIC_KEY.includes("REPLACE_THIS")) return alert("Paystack key missing. Cannot process paid ticket.");
        
        let handler = PaystackPop.setup({
          key: PAYSTACK_PUBLIC_KEY,
          email: activeUserEmail || `${activeUsername}@sporttech.app`,
          amount: price * 100, 
          currency: 'NGN',
          ref: 'TKT_' + Math.floor((Math.random() * 1000000000) + 1),
          callback: function(response) {
            issueDigitalTicket(eventId, title, response.reference);
          },
          onClose: function() { alert('Transaction window closed.'); }
        });
        handler.openIframe();
      }
    };

    async function issueDigitalTicket(eventId, title, paymentRef) {
      try {
        await addDoc(collection(db, `users/${activeUserId}/tickets`), {
          eventId: eventId,
          eventTitle: title,
          paymentRef: paymentRef,
          purchasedAt: serverTimestamp(),
          qrCodeData: `ST_TKT_${activeUserId}_${eventId}` // Organizer scans this at the gate
        });
        
        // Increment global ticket sold counter
        const eventRef = doc(db, "events", eventId);
        const evSnap = await getDoc(eventRef);
        await updateDoc(eventRef, { ticketsSold: (evSnap.data().ticketsSold || 0) + 1 });

        alert(`Success! Your ticket for "${title}" has been issued. Check your Profile > My Tickets to view the QR Gate Code.`);
      } catch (error) {
        alert("Failed to issue ticket. Please contact support.");
      }
    }

    // Interactive functions (Likes, Comments) omitted from the snippet but they remain identical to the previous version
    window.toggleLike = async function(postId) { /* Same as before */ };
    window.openComments = function(postId) { /* Same as before */ };
    window.toggleCommentsModal = function() { document.getElementById('commentsModal').classList.toggle('hidden'); if(commentsUnsubscribe) commentsUnsubscribe(); };
  </script>
</body>
</html>
